services:
  stats_db:
    image: mysql:8.0
    container_name: stats_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env}
      MYSQL_DATABASE: statistics_db
      MYSQL_USER: stats_user
      MYSQL_PASSWORD: ${STATS_DB_PASSWORD:?set it in .env}
    ports:
      - "3307:3306" # Εξωτερική πόρτα 3307
    volumes:
      - stats_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared-api-network

  stats_api:
    build: .
    container_name: stats_api
    volumes:
      - .:/app
    environment:
      - DB_HOST=stats_db
      - DB_USER=stats_user
      - DB_PASSWORD=${STATS_DB_PASSWORD:?set it in .env}
      - DB_NAME=statistics_db
    depends_on:
      - stats_db
    networks:
      - shared-api-network

volumes:
  stats_db_data:

networks:
  shared-api-network:
    external: true